[project]
name = "pstostparser"
version = "0.1.0"
description = "Parse Outlook .pst and .ost files: list folders, extract emails, export to JSON/CSV/SQLite/EML"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
aspose = ["Aspose.Email-for-Python-via-NET"]
pypff = ["pypff"]
all = ["Aspose.Email-for-Python-via-NET", "pypff"]

[project.scripts]
pstostparser = "pstostparser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pstostparser"]

[tool.uv]
package = true
